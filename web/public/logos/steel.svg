<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 31.9712 31.9712">
  <!--
    The mark on its own, no wordmark.

    The glyph is one path: a filled square with the arrow cut out of it, so the
    counter is transparent rather than painted. That means a single fill colour
    decides the whole icon, and a fixed dark navy would disappear into a dark
    browser chrome. The media query swaps it for a light tint there, so the
    mark keeps its contrast whichever way the browser is themed.
  -->
  <style>
    path { fill: #001a29; }
    @media (prefers-color-scheme: dark) {
      path { fill: #e0eff9; }
    }
  </style>
